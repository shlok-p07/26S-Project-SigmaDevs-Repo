name: project-app-team-repo

services:
  app:
    build: ./app
    container_name: web-app
    hostname: web-app
    volumes: ["./app/src:/appcode"]
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - 8501:8501

  api:
    build: ./api
    container_name: web-api
    hostname: web-api
    volumes: ["./api:/apicode"]
    env_file:
      - ./api/.env
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - db
    ports:
      - 4000:4000

  # Refreshes market data every weekday after the close (see api/backend/market/scheduler.py)
  scheduler:
    build: ./api
    container_name: market-scheduler
    volumes: ["./api:/apicode"]
    env_file:
      - ./api/.env
    command: ["python", "-u", "-m", "backend.market.scheduler"]
    depends_on:
      - db
    restart: unless-stopped

  db:
    env_file:
      - ./api/.env
    image: mysql:9
    container_name: mysql_db
    hostname: db
    volumes:
      - "./database-files:/docker-entrypoint-initdb.d/:ro"
      - "mysql_data:/var/lib/mysql"
    ports:
      - 3200:3306

volumes:
  mysql_data:
