# ------------------------------------------------------------
# In this file, you can make some modifications to the Streamlit
# app's global environment. 
#
# All of the possible config options can be found here:
# https://docs.streamlit.io/develop/api-reference/configuration/config.toml
# ------------------------------------------------------------


[client]
# Turning the default sidebar navigation off so we 
# can use our own
showSidebarNavigation = false

[theme]
# Professional dark theme (validated chart palette; see app/src/modules/quant_ui.py)
base="dark"
primaryColor="#3987e5"
backgroundColor="#0d0d0d"
secondaryBackgroundColor="#1a1a19"
textColor="#f2f1ec"
font="sans-serif"
borderColor="#2c2c2a"
baseRadius="10px"
chartCategoricalColors=["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[server]
runOnSave = true